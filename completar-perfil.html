<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>KICHAY - Cuentanos sobre ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/fonts.css?v=3.1.0" />
  <link rel="stylesheet" href="css/perfil.css?v=3.1.0" />
</head>
<body>

  <div class="hero-bg"></div>

  <div class="card-wrap">
    <div class="card" id="card-perfil">

      <div class="step-indicator">
        <span class="step done">1</span>
        <span class="step-line done-line"></span>
        <span class="step active">2</span>
        <span class="step-line"></span>
        <span class="step">3</span>
      </div>

      <h2 class="card-title">¡Cuéntanos sobre ti!</h2>
      <p class="card-sub">Para personalizar tu experiencia de aprendizaje</p>

      <div class="field-group">
        <label for="inp-nombre">Tu nombre</label>
        <input id="inp-nombre" type="text" placeholder="¿Cómo te llamas?" maxlength="40" autocomplete="given-name" />
      </div>

      <div class="field-group">
        <label>Sexo</label>
        <div class="sex-options">
          <button class="sex-btn" data-val="masculino" onclick="selectSex(this)">
            <span class="sex-icon">&#128102;</span>
            <span>Masculino</span>
          </button>
          <button class="sex-btn" data-val="femenino" onclick="selectSex(this)">
            <span class="sex-icon">&#128103;</span>
            <span>Femenino</span>
          </button>
          <button class="sex-btn" data-val="otro" onclick="selectSex(this)">
            <span class="sex-icon">&#127775;</span>
            <span>Otro</span>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label>Edad</label>
        <div class="edad-wrap">
          <button class="edad-btn" onclick="cambiarEdad(-1)">-</button>
          <span id="edad-display" class="edad-display">12</span>
          <button class="edad-btn" onclick="cambiarEdad(1)">+</button>
        </div>
        <p class="edad-hint">años</p>
      </div>

      <p id="error-msg" class="error-msg" style="display:none;"></p>

      <button class="btn-continuar" id="btn-continuar" onclick="guardarPerfil()">
        ¡Empecemos la aventura! &#128640;
      </button>

    </div>
  </div>

  <script src="js/sound.js"></script>
  <script>
    // Bloquear boton "atras"
    history.pushState(null, "", location.href);
    window.addEventListener("popstate", function() {
      history.pushState(null, "", location.href);
    });

    // Estado del formulario
    var edadActual       = 12;
    var sexoSeleccionado = "";
    var _mod             = null;  // modulo Firebase cargado

    // Pre-rellenar nombre desde sessionStorage
    document.addEventListener("DOMContentLoaded", function() {
      var nombre = sessionStorage.getItem("kichay_user") || "";
      if (nombre) {
        var inp = document.getElementById("inp-nombre");
        if (inp && !inp.value) inp.value = nombre.split(" ")[0];
      }
    });

    // Cargar Firebase
    var firebaseUrl = new URL("js/firebase.js", location.href).href;
    import(firebaseUrl).then(function(mod) {
      _mod = mod;

      // Verificar sesion
      mod.onAuthStateChanged(mod.auth, function(fbUser) {
        if (fbUser) {
          // Pre-rellenar nombre con displayName de Google si el campo esta vacio
          var inp = document.getElementById("inp-nombre");
          if (inp && !inp.value && fbUser.displayName) {
            inp.value = fbUser.displayName.split(" ")[0];
          }
        } else {
          // Sin sesion Firebase: verificar modo local
          if (!sessionStorage.getItem("kichay_uid")) {
            window.location.replace("index.html");
          }
        }
      });
    }).catch(function(err) {
      console.error("[KICHAY] Error cargando Firebase en perfil:", err);
      // Si no hay sesion ni Firebase, redirigir
      if (!sessionStorage.getItem("kichay_uid")) {
        window.location.replace("index.html");
      }
    });

    // Interacciones del formulario
    window.selectSex = function(btn) {
      document.querySelectorAll(".sex-btn").forEach(function(b) { b.classList.remove("selected"); });
      btn.classList.add("selected");
      sexoSeleccionado = btn.dataset.val;
    };

    window.cambiarEdad = function(delta) {
      edadActual = Math.min(99, Math.max(5, edadActual + delta));
      document.getElementById("edad-display").textContent = edadActual;
    };

    window.guardarPerfil = async function() {
      var nombre = document.getElementById("inp-nombre").value.trim();
      if (!nombre)          { mostrarError("Por favor, escribe tu nombre 😊"); return; }
      if (!sexoSeleccionado){ mostrarError("Selecciona tu sexo para continuar"); return; }

      var btn = document.getElementById("btn-continuar");
      btn.disabled    = true;
      btn.textContent = "Guardando...";

      try {
        var uid = (_mod && _mod.auth.currentUser)
          ? _mod.auth.currentUser.uid
          : sessionStorage.getItem("kichay_uid");

        if (_mod && uid) {
          try {
            await _mod.completarPerfil(uid, { nombre: nombre, sexo: sexoSeleccionado, edad: edadActual });
            var nuevaRacha = await _mod.actualizarAcceso(uid, 0, null);
            sessionStorage.setItem("kichay_racha", nuevaRacha);
            sessionStorage.setItem("kichay_intis", "0");
          } catch (fsErr) {
            console.warn("[KICHAY] Firestore perfil aviso:", fsErr);
          }
        }

        // Guardar en sessionStorage
        sessionStorage.setItem("kichay_user",            nombre);
        sessionStorage.setItem("kichay_sexo",            sexoSeleccionado);
        sessionStorage.setItem("kichay_edad",            edadActual);
        sessionStorage.setItem("kichay_perfil_completo", "1");

        document.body.classList.add("page-exit");
        setTimeout(function() { window.location.href = "dashboard.html"; }, 450);

      } catch (err) {
        console.error("[KICHAY] Error guardando perfil:", err);
        mostrarError("Error al guardar. Intenta de nuevo.");
        btn.disabled    = false;
        btn.textContent = "¡Empecemos la aventura! 🚀";
      }
    };

    function mostrarError(msg) {
      var el = document.getElementById("error-msg");
      el.textContent   = msg;
      el.style.display = "block";
      setTimeout(function() { el.style.display = "none"; }, 3000);
    }
  </script>
</body>
</html>
