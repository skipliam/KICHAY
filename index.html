<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>KICHAY – Aprende sobre el Perú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/fonts.css?v=3.1.0" />
  <link rel="stylesheet" href="css/login.css?v=3.1.0" />
  <!-- Google OAuth SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ══════════════════════════════════════════════════
       PANTALLA 1: LOGIN
  ══════════════════════════════════════════════════════ -->
  <main id="login-screen" class="hero">

    <!-- Fondo ilustrado con ruta absoluta -->
    <div class="hero-bg" aria-hidden="true"
         style="background-image: url('IMG/FONDOPRINCIPAL.jpeg');
                background-size: cover; background-position: center; background-repeat: no-repeat;">
    </div>

    <!-- Logo KICHAY oficial -->
    <div class="logo-wrap">
      <img src="IMG/logoprincipal.png" alt="KICHAY – Aprende sobre el Perú" class="logo-img" />
    </div>

    <!-- Contenedor Kusi + Tarjeta juntos -->
    <div class="hero-content">

      <!-- Personaje Kusi en Video (personajesaltando) con partículas mágicas -->
      <div class="mascot-wrap">
        <div class="particles-container" aria-hidden="true">
          <span class="particle p1">✨</span>
          <span class="particle p2">✦</span>
          <span class="particle p3">🌟</span>
          <span class="particle p4">✨</span>
          <span class="particle p5">✦</span>
        </div>
        <video class="mascot-video" autoplay loop muted playsinline disablepictureinpicture preload="auto">
          <source src="IMG/personajesaltando.webm" type="video/webm">
          <source src="IMG/personajesaltando.mp4" type="video/mp4">
          <img src="IMG/PERSONAJE.png" alt="Kusi" class="mascot-img" />
        </video>
      </div>

      <!-- Tarjeta de Login — solo Google -->
      <div class="login-card" role="main">

        <!-- Indicador de pasos (Paso 1 activo) -->
        <div class="step-indicator">
          <span class="step active">1</span>
          <span class="step-line"></span>
          <span class="step">2</span>
          <span class="step-line"></span>
          <span class="step">3</span>
        </div>

        <h2 class="card-title">¡Hola! Soy Kusi</h2>
        <p class="card-subtitle">Vamos a descubrir el Perú juntos.</p>

        <!-- Google Sign-In oficial -->
        <div id="g_id_onload"
             data-client_id="972842454156-30iv03hm1q4sv717n187hu2vhc6n8d0k.apps.googleusercontent.com"
             data-callback="handleGoogleLogin"
             data-auto_select="false"
             data-auto_prompt="false">
        </div>
        <div class="google-btn-wrap">
          <div class="g_id_signin"
               data-type="standard"
               data-size="large"
               data-theme="filled_blue"
               data-text="signin_with"
               data-shape="pill"
               data-locale="es"
               data-width="320">
          </div>
        </div>

        <!-- Botón para que otro alumno inicie con su propia cuenta -->
        <button type="button" class="btn-switch-account" onclick="cambiarCuentaGoogle()">
          🔄 ¿No eres tú? Iniciar con otra cuenta
        </button>

        <p class="card-footer-note">🔒 Tu cuenta de Google se usa de forma segura</p>

      </div><!-- /login-card -->

    </div><!-- /hero-content -->

  </main>

  <script>
    // Guard: si llegan al login, limpiar sesión anterior para forzar flujo completo
    sessionStorage.removeItem('kichay_user');
    sessionStorage.removeItem('kichay_perfil_completo');
    sessionStorage.removeItem('kichay_uid');
    sessionStorage.removeItem('kichay_racha');
    sessionStorage.removeItem('kichay_intis');
    sessionStorage.removeItem('kichay_sexo');
    sessionStorage.removeItem('kichay_edad');

    // Bloquear botón "atrás" del navegador desde login
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', () => {
      history.pushState(null, '', location.href);
    });

    // Asegurar reproducción continua del video de Kusi
    document.addEventListener('DOMContentLoaded', () => {
      const vid = document.querySelector('.mascot-video');
      if (vid) {
        vid.muted = true;
        vid.play().catch(() => {});
      }
    });
  </script>
  <script src="js/sound.js?v=3.1.0"></script>
  <!-- Login: script NORMAL (no modulo) para que handleGoogleLogin sea global inmediatamente -->
  <script src="js/login.js?v=3.1.0"></script>
</body>
</html>
