<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KICHAY – Aprende sobre el Perú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
  <!-- Google OAuth SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ══════════════════════════════════════════════════
       PANTALLA 1: LOGIN
  ══════════════════════════════════════════════════════ -->
  <main id="login-screen" class="hero">

    <!-- Fondo ilustrado con ruta absoluta -->
    <div class="hero-bg" aria-hidden="true"
         style="background-image: url('IMG/FONDOPRINCIPAL.jpeg');
                background-size: cover; background-position: center; background-repeat: no-repeat;">
    </div>

    <!-- Logo KICHAY oficial -->
    <div class="logo-wrap">
      <img src="IMG/logoprincipal.png" alt="KICHAY – Aprende sobre el Perú" class="logo-img" />
    </div>

    <!-- Contenedor Kusi + Tarjeta juntos -->
    <div class="hero-content">

      <!-- Personaje Kusi con partículas -->
      <div class="mascot-wrap">
        <div class="particles-container" aria-hidden="true">
          <span class="particle p1">✨</span>
          <span class="particle p2">✦</span>
          <span class="particle p3">🌟</span>
          <span class="particle p4">✦</span>
          <span class="particle p5">✨</span>
          <span class="particle p6">●</span>
          <span class="particle p7">●</span>
          <span class="particle p8">✦</span>
          <span class="particle p9">✨</span>
        </div>
        <img src="IMG/PERSONAJE.png" alt="Kusi saludando" class="mascot-img" />
      </div>

      <!-- Tarjeta de Login — solo Google -->
      <div class="login-card" role="main">

        <!-- Indicador de pasos (Paso 1 activo) -->
        <div class="step-indicator">
          <span class="step active">1</span>
          <span class="step-line"></span>
          <span class="step">2</span>
          <span class="step-line"></span>
          <span class="step">3</span>
        </div>

        <h2 class="card-title">¡Hola! Soy Kusi</h2>
        <p class="card-subtitle">Vamos a descubrir el Perú juntos.</p>

        <!-- Google Sign-In oficial -->
        <div id="g_id_onload"
             data-client_id="760958817830-pm8u2pc85mjl460pbqp6hglqsccs1gs3.apps.googleusercontent.com"
             data-callback="handleGoogleLogin"
             data-auto_prompt="false">
        </div>
        <div class="google-btn-wrap">
          <div class="g_id_signin"
               data-type="standard"
               data-size="large"
               data-theme="filled_blue"
               data-text="continue_with"
               data-shape="pill"
               data-locale="es"
               data-width="320">
          </div>
        </div>

        <p class="card-footer-note">🔒 Tu cuenta de Google se usa de forma segura</p>

      </div><!-- /login-card -->

    </div><!-- /hero-content -->

  </main>

  <script>
    // Guard: si llegan al login, limpiar sesión anterior para forzar flujo completo
    sessionStorage.removeItem('kichay_user');
    sessionStorage.removeItem('kichay_perfil_completo');
    sessionStorage.removeItem('kichay_uid');
    sessionStorage.removeItem('kichay_racha');
    sessionStorage.removeItem('kichay_intis');
    sessionStorage.removeItem('kichay_sexo');
    sessionStorage.removeItem('kichay_edad');

    // Bloquear botón "atrás" del navegador desde login
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', () => {
      history.pushState(null, '', location.href);
    });
  </script>
  <script src="js/sound.js"></script>
  <!-- Login: script NORMAL (no modulo) para que handleGoogleLogin sea global inmediatamente -->
  <script src="js/login.js"></script>
</body>
</html>
